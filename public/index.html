<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Icons are served from public/ rather than generated from app.json's
         web.favicon, so their links can carry a version. Browsers cache tab
         icons very aggressively; bump ?v= whenever the icon changes or
         returning visitors keep seeing the old one. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" sizes="192x192" />
    <!-- Used when the site is added to an iPhone/iPad home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- The react-native-web recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
